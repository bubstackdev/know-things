[package]
name = "know-things"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
rmcp = { version = "3.9.0", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
url = "2.5.9"
uuid = { version = "1.29.2", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
