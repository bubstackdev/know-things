name: know-things
services:
  kb:
    image: ${KB_IMAGE:-know-things:local}
    build:
      context: .
      args:
        KB_BUILD_VERSION: ${KB_BUILD_VERSION:-}
    platform: linux/arm64
    container_name: ${KB_CONTAINER_NAME:-know-things}
    command: ["serve", "--database", "${KB_DATABASE:-/data/index.sqlite}"]
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 256m
    pids_limit: 256
    stop_grace_period: 15s
    tmpfs:
      - /run/know-things:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=65532,gid=65532
    volumes:
      - type: bind
        source: ${KB_SOURCE_DIR:?Set KB_SOURCE_DIR to the exported source directory}
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: index
        target: /data
    healthcheck:
      test: [CMD, /usr/local/bin/know-things, status, --ready]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 20s
volumes:
  index:
